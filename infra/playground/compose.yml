name: lucena-playground-staging
services:
  edge:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    environment:
      PLAYGROUND_HOST: ${PLAYGROUND_HOST:?Set the dedicated staging hostname}
      NO_PROXY: web,sandbox,localhost,127.0.0.1
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    depends_on:
      web:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    networks: [public, private]
  web:
    build:
      context: ../../frontend
      dockerfile: ../infra/playground/frontend.Dockerfile
    restart: unless-stopped
    environment:
      PLAYGROUND_ORIGIN: https://${PLAYGROUND_HOST:?Set the dedicated staging hostname}
      NO_PROXY: web,sandbox,localhost,127.0.0.1
    networks: [private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
  sandbox:
    build:
      context: ../../backend
      dockerfile: ../infra/playground/backend.Dockerfile
    restart: unless-stopped
    environment:
      PLAYGROUND_ORIGIN: https://${PLAYGROUND_HOST:?Set the dedicated staging hostname}
      NO_PROXY: web,sandbox,localhost,127.0.0.1
    volumes:
      - sessions:/sandbox
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
networks:
  public:
  private:
    internal: true
volumes:
  certificates:
  sessions:
